<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baixar YouTube</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icone.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="brilho"></div>

    <main class="container">
      <header>
        <!-- Sino de notificações (a bolinha aparece quando há versão nova) -->
        <button type="button" id="sino" class="sino" title="Notificações" aria-label="Notificações">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="sino-ponto" class="sino-ponto" hidden></span>
        </button>
        <div id="notificacoes" class="notificacoes escondido">
          <strong class="notificacoes-titulo">Notificações</strong>
          <div id="notificacoes-conteudo"></div>
        </div>

        <img class="logo" src="logo.webp" alt="Logo do Baixar YouTube" />
        <span class="etiqueta">Baixar YouTube · Converter Foto</span>
        <h1>Seus vídeos e músicas, <span>salvos em segundos.</span></h1>
        <p class="subtitulo">
          Vídeos em MP4, músicas em MP3 e fotos HEIC para JPG, direto na sua pasta Downloads.
        </p>
      </header>

      <!-- Aviso de versão nova (preenchido pelo script.js com /api/versao) -->
      <div id="aviso-atualizacao" class="atualizacao escondido">
        <strong id="atualizacao-titulo"></strong>
        <ul id="atualizacao-novidades"></ul>
        <div class="atualizacao-botoes">
          <button type="button" id="botao-atualizar" class="botao-atualizar">
            ⬆ Atualizar agora
          </button>
          <button type="button" id="botao-depois" class="botao-depois">Depois</button>
        </div>
        <p id="atualizacao-mensagem" class="atualizacao-mensagem"></p>
      </div>

      <!-- Abas -->
      <nav class="abas">
        <button class="aba ativa" data-aba="youtube">YouTube</button>
        <button class="aba" data-aba="heic">HEIC → JPG</button>
      </nav>

      <!-- Ferramenta 1: YouTube -->
      <section id="youtube" class="card">
        <form id="form-download">
          <input
            id="url"
            type="url"
            placeholder="Cole o link do YouTube..."
            required
          />

          <!-- Aparece quando o link é de uma playlist (preenchido pelo script.js) -->
          <div id="aviso-playlist" class="aviso escondido">
            <p id="aviso-texto"></p>
            <button
              type="button"
              id="usar-so-video"
              class="aviso-botao escondido"
            >
              Usar só este vídeo
            </button>
          </div>

          <!-- Prévia do vídeo: aparece quando um link é colado (preenchida pelo script.js) -->
          <div id="previa" class="previa escondido">
            <div id="previa-midia" class="previa-midia">
              <img id="previa-miniatura" alt="" />
              <button
                type="button"
                id="previa-play"
                class="previa-play"
                title="Assistir aqui"
              >
                ▶
              </button>
              <span id="previa-duracao" class="previa-duracao"></span>
            </div>
            <div class="previa-info">
              <p id="previa-titulo" class="previa-titulo"></p>
              <p id="previa-canal" class="previa-canal"></p>
            </div>
          </div>

          <div class="opcoes">
            <div class="grupo" id="formatos">
              <button type="button" class="chip ativo" data-formato="mp4">
                MP4
              </button>
              <button type="button" class="chip" data-formato="mp3">MP3</button>
            </div>
            <div class="grupo" id="qualidades">
              <!-- Preenchido pelo script.js com /api/qualidades -->
            </div>
          </div>

          <!-- Cortar trecho: baixa só um pedaço do vídeo -->
          <div class="cortar">
            <button type="button" id="botao-cortar" class="chip">
              ✂ Cortar trecho
            </button>
            <div id="campos-trecho" class="campos-trecho escondido">
              <label>
                Início
                <input id="trecho-inicio" class="campo-tempo" placeholder="0:00" />
              </label>
              <span class="separador">até</span>
              <label>
                Fim
                <input id="trecho-fim" class="campo-tempo" placeholder="fim" />
              </label>
            </div>
          </div>
          <p id="erro-trecho" class="erro-trecho"></p>

          <button type="submit" class="botao">Baixar agora</button>
        </form>

        <ul id="lista-downloads"></ul>
      </section>

      <!-- Ferramenta 2: HEIC -->
      <section id="heic" class="card escondido">
        <label class="area-arquivo" id="area-arquivo">
          <input id="arquivo-heic" type="file" accept=".heic,.heif" hidden />
          <span class="icone">⬆</span>
          <span>Clique ou arraste uma foto <b>.heic</b> aqui</span>
        </label>
        <p id="status-heic" class="status"></p>
      </section>

      <footer>
        <p id="versao" class="versao"></p>
        <button id="encerrar" class="encerrar">⏻ Encerrar programa</button>
      </footer>
    </main>

    <!-- Notificação que desliza no canto quando sai uma versão nova -->
    <div id="toast" class="toast escondido" role="status" aria-live="polite">
      <div class="toast-texto">
        <strong id="toast-titulo"></strong>
        <p id="toast-descricao"></p>
      </div>
      <div class="atualizacao-botoes">
        <button type="button" id="toast-atualizar" class="botao-atualizar">⬆ Atualizar agora</button>
        <button type="button" id="toast-depois" class="botao-depois">Depois</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
