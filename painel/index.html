<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baixar YouTube</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icone.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="brilho"></div>

    <main class="container">
      <header>
        <!-- Botões do canto: abrir no navegador, configurações e notificações -->
        <div class="acoes-topo">
          <button type="button" id="abrir-navegador" class="botao-topo" title="Abrir no navegador" aria-label="Abrir no navegador" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <path d="M15 3h6v6" />
              <path d="M10 14 21 3" />
            </svg>
          </button>
          <button type="button" id="config" class="botao-topo" title="Configurações" aria-label="Configurações">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <!-- Sino de notificações (a bolinha aparece quando há versão nova) -->
          <button type="button" id="sino" class="sino botao-topo" title="Notificações" aria-label="Notificações">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span id="sino-ponto" class="sino-ponto" hidden></span>
          </button>
        </div>
        <div id="notificacoes" class="notificacoes escondido">
          <strong class="notificacoes-titulo">Notificações</strong>
          <div id="notificacoes-conteudo"></div>
        </div>

        <!-- Configurações: abrir sempre na janela do aplicativo ou no navegador -->
        <div id="configuracoes" class="notificacoes configuracoes escondido">
          <strong class="notificacoes-titulo">Configurações</strong>
          <p class="config-rotulo">Abrir o programa em</p>
          <div class="config-opcoes" id="config-modo">
            <button type="button" class="chip" data-modo="janela">Janela do aplicativo</button>
            <button type="button" class="chip" data-modo="navegador">Navegador</button>
          </div>
          <p id="config-dica" class="config-dica"></p>
          <button type="button" id="config-trocar" class="botao-depois"></button>
        </div>

        <img class="logo" src="logo.webp" alt="Logo do Baixar YouTube" />
        <span class="etiqueta">Baixar YouTube · Converter Foto</span>
        <h1>Seus vídeos e músicas, <span>salvos em segundos.</span></h1>
        <p class="subtitulo">
          Vídeos do YouTube, TikTok e Instagram em MP4 ou MP3, e fotos convertidas ou comprimidas, direto na sua pasta Downloads.
        </p>
      </header>

      <!-- Aviso de versão nova (preenchido pelo script.js com /api/versao) -->
      <div id="aviso-atualizacao" class="atualizacao escondido">
        <strong id="atualizacao-titulo"></strong>
        <ul id="atualizacao-novidades"></ul>
        <div class="atualizacao-botoes">
          <button type="button" id="botao-atualizar" class="botao-atualizar">
            ⬆ Atualizar agora
          </button>
          <button type="button" id="botao-depois" class="botao-depois">Depois</button>
        </div>
        <p id="atualizacao-mensagem" class="atualizacao-mensagem"></p>
      </div>

      <!-- Abas -->
      <nav class="abas">
        <button class="aba ativa" data-aba="youtube">Vídeos</button>
        <button class="aba" data-aba="heic">Converter foto</button>
        <button class="aba" data-aba="comprimir">Comprimir foto</button>
        <button class="aba" data-aba="meus-downloads">Meus downloads</button>
      </nav>

      <!-- Ferramenta 1: YouTube -->
      <section id="youtube" class="card">
        <form id="form-download">
          <input
            id="url"
            type="url"
            placeholder="Cole o link do YouTube, TikTok ou Instagram..."
            required
          />

          <!-- Aparece quando o link é de uma playlist (preenchido pelo script.js) -->
          <div id="aviso-playlist" class="aviso escondido">
            <p id="aviso-texto"></p>
            <button
              type="button"
              id="usar-so-video"
              class="aviso-botao escondido"
            >
              Usar só este vídeo
            </button>
          </div>

          <!-- Prévia do vídeo: aparece quando um link é colado (preenchida pelo script.js) -->
          <div id="previa" class="previa escondido">
            <div id="previa-midia" class="previa-midia">
              <img id="previa-miniatura" alt="" />
              <button
                type="button"
                id="previa-play"
                class="previa-play"
                title="Assistir aqui"
              >
                ▶
              </button>
              <span id="previa-duracao" class="previa-duracao"></span>
            </div>
            <div class="previa-info">
              <p id="previa-titulo" class="previa-titulo"></p>
              <p id="previa-canal" class="previa-canal"></p>
            </div>
          </div>

          <div class="opcoes">
            <div class="grupo" id="formatos">
              <button type="button" class="chip ativo" data-formato="mp4">
                MP4
              </button>
              <button type="button" class="chip" data-formato="mp3">MP3</button>
            </div>
            <div class="grupo" id="qualidades">
              <!-- Preenchido pelo script.js com /api/qualidades -->
            </div>
          </div>

          <!-- Cortar trecho: baixa só um pedaço do vídeo -->
          <div class="cortar">
            <button type="button" id="botao-cortar" class="chip">
              ✂ Cortar trecho
            </button>
            <div id="campos-trecho" class="campos-trecho escondido">
              <label>
                Início
                <input id="trecho-inicio" class="campo-tempo" placeholder="0:00" />
              </label>
              <span class="separador">até</span>
              <label>
                Fim
                <input id="trecho-fim" class="campo-tempo" placeholder="fim" />
              </label>
            </div>
          </div>
          <p id="erro-trecho" class="erro-trecho"></p>

          <button type="submit" class="botao">Baixar agora</button>
        </form>

        <ul id="lista-downloads"></ul>
      </section>

      <!-- Ferramenta 2: Converter foto (HEIC -> JPG, HEIC/JPG/PNG -> WebP) -->
      <section id="heic" class="card escondido">
        <div class="grupo grupo-conversao" id="formatos-foto">
          <button type="button" class="chip ativo" data-formato="jpg">JPG</button>
          <button type="button" class="chip" data-formato="webp">WebP</button>
        </div>
        <label class="area-arquivo" id="area-arquivo">
          <input id="arquivo-heic" type="file" accept=".heic,.heif" multiple hidden />
          <span class="icone">⬆</span>
          <span id="texto-arquivo">Clique ou arraste uma ou várias fotos <b>.heic</b></span>
        </label>
        <p id="resumo-conversao" class="resumo-compressao"></p>
        <ul id="lista-conversao" class="lista-fotos"></ul>
      </section>

      <!-- Ferramenta 3: Comprimir foto (uma ou várias de uma vez) -->
      <section id="comprimir" class="card escondido">
        <div class="opcoes-compressao">
          <div>
            <p class="rotulo-opcao">Nível</p>
            <div class="grupo" id="niveis-compressao">
              <button type="button" class="chip" data-nivel="alta">Alta qualidade</button>
              <button type="button" class="chip ativo" data-nivel="equilibrado">Equilibrado</button>
              <button type="button" class="chip" data-nivel="forte">Máxima compressão</button>
            </div>
          </div>
          <div>
            <p class="rotulo-opcao">Tamanho máximo</p>
            <div class="grupo" id="tamanhos-compressao">
              <button type="button" class="chip ativo" data-tamanho="original">Original</button>
              <button type="button" class="chip" data-tamanho="2560">2560 px</button>
              <button type="button" class="chip" data-tamanho="1920">1920 px</button>
              <button type="button" class="chip" data-tamanho="1280">1280 px</button>
            </div>
          </div>
          <p id="dica-compressao" class="dica-compressao"></p>
        </div>
        <label class="area-arquivo" id="area-compressao">
          <input id="arquivos-compressao" type="file" accept=".jpg,.jpeg,.png,.webp,.heic,.heif" multiple hidden />
          <span class="icone">⬇</span>
          <span>Clique ou arraste uma ou várias fotos <b>.jpg</b>, <b>.png</b>, <b>.webp</b> ou <b>.heic</b></span>
        </label>
        <p id="resumo-compressao" class="resumo-compressao"></p>
        <ul id="lista-compressao" class="lista-fotos"></ul>
      </section>

      <!-- Meus downloads: histórico do que o programa salvou (preenchido pelo script.js) -->
      <section id="meus-downloads" class="card escondido">
        <div class="historico-topo">
          <div class="grupo" id="filtros-historico">
            <button type="button" class="chip ativo" data-tipo="todos">Todos</button>
            <button type="button" class="chip" data-tipo="video">Vídeos</button>
            <button type="button" class="chip" data-tipo="musica">Músicas</button>
            <button type="button" class="chip" data-tipo="foto">Fotos</button>
          </div>
          <button type="button" id="limpar-historico" class="item-botao">Limpar lista</button>
        </div>
        <ul id="lista-historico"></ul>
        <p id="historico-vazio" class="status escondido"></p>
      </section>

      <footer>
        <p id="versao" class="versao"></p>
        <button id="encerrar" class="encerrar">⏻ Encerrar programa</button>
      </footer>
    </main>

    <!-- Notificação que desliza no canto quando sai uma versão nova -->
    <div id="toast" class="toast escondido" role="status" aria-live="polite">
      <div class="toast-texto">
        <strong id="toast-titulo"></strong>
        <p id="toast-descricao"></p>
      </div>
      <div class="atualizacao-botoes">
        <button type="button" id="toast-atualizar" class="botao-atualizar">⬆ Atualizar agora</button>
        <button type="button" id="toast-depois" class="botao-depois">Depois</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
