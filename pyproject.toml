[project]
name = "puxai"
version = "1.0.0"
description = "Baixa vídeos do YouTube em MP4/MP3 e converte fotos para JPG e WebP, com painel próprio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "waitress",            # servidor web (mais robusto que o servidor de desenvolvimento do Flask)
    "pywebview",           # abre o painel numa janela própria, em vez do navegador
    "yt-dlp[default]",     # [default] inclui o yt-dlp-ejs, que o yt-dlp usa junto com o Deno
]

[tool.uv]
# É um aplicativo, não uma biblioteca: o uv só instala as dependências
package = false
